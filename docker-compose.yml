version: "3.8"

services:
  hermes:
    image: nousresearch/hermes-agent
    container_name: hermes-agent
    restart: unless-stopped
    volumes:
      - ~/.hermes:/opt/data
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - HERMES_DASHBOARD=1
    ports:
      - "8642:8642"
    # Для Gateway mode или запуска нужного процесса агента
    command: ["gateway", "run"]

  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
