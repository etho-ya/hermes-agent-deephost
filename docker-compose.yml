version: "3.8"

services:
  hermes:
    image: nousresearch/hermes-agent
    container_name: hermes-agent
    restart: unless-stopped
    volumes:
      - ~/.hermes:/opt/data
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    ports:
      - "8642:8642"
    # Для Gateway mode или запуска нужного процесса агента (по умолчанию может быть setup или gateway)
    command: ["gateway", "run"]

  webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    restart: unless-stopped
    ports:
      - "8888:8000"
    environment:
      - GATEWAY_URL=http://hermes:8642
    depends_on:
      - hermes
