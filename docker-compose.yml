version: "3.8"

services:
  hermes:
    image: nousresearch/hermes-agent
    container_name: hermes-agent
    restart: unless-stopped
    volumes:
      - ./data:/opt/data
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    ports:
      - "8642:8642"
    # Для Gateway mode или запуска нужного процесса агента (по умолчанию может быть setup или gateway)
    command: ["gateway", "run"]
